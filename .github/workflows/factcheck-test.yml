name: Fact-Check a Post (test only)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Post file name without .html"
        required: true
        type: string

jobs:
  factcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/scripts/requirements.txt

      - name: Fact-check (prints results, changes nothing)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLUG: ${{ inputs.slug }}
        run: python .github/scripts/factcheck.py "blog/$SLUG.html" --no-audit
