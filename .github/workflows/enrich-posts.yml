name: Add Quick Answers and FAQs to Posts

on:
  workflow_dispatch:

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r .github/scripts/requirements.txt

      - name: Add quick answers and FAQs to every post that lacks them
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python .github/scripts/enrich_post.py --all
          python .github/scripts/build_llms_full.py

      - name: Commit
        run: |
          git config user.name "blog-agent[bot]"
          git config user.email "blog-agent@nalawtx.com"
          git add blog/ llms-full.txt
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add quick answers and FAQs to blog posts"
          git pull --rebase -q origin main
          git push
