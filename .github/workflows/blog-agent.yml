name: Blog Agent

on:
  schedule:
    - cron: "0 14 * * 1"  # Monday 9am CT (winter) / 10am CT (summer due to DST)
  workflow_dispatch: {}

concurrency:
  group: blog-agent
  cancel-in-progress: false

jobs:
  generate-post:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Set cadence flag
        id: cadence
        run: |
          echo "should_run=true" >> $GITHUB_OUTPUT

      - name: Checkout
        if: steps.cadence.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.cadence.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.cadence.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/scripts/requirements.txt

      - name: Run CEO agent
        if: steps.cadence.outputs.should_run == 'true'
        id: ceo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          BLOG_AGENT_SHEET_ID: ${{ secrets.BLOG_AGENT_SHEET_ID }}
        run: |
          python .github/scripts/ceo.py

      - name: Configure git
        if: steps.cadence.outputs.should_run == 'true' && steps.ceo.outputs.slug != ''
        run: |
          git config user.name "blog-agent[bot]"
          git config user.email "blog-agent@nalawtx.com"

      - name: Create branch and commit
        if: steps.cadence.outputs.should_run == 'true' && steps.ceo.outputs.slug != ''
        id: commit
        run: |
          BRANCH="blog-agent/${{ steps.ceo.outputs.slug }}"
          git checkout -b "$BRANCH"
          git add blog/
          if git diff --staged --quiet; then
            echo "No changes to commit. Exiting."
            echo "committed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "blog: ${{ steps.ceo.outputs.title }}

          Topic: ${{ steps.ceo.outputs.topic }}
          Compliance: ${{ steps.ceo.outputs.compliance_status }}
          Sensitivity: ${{ steps.ceo.outputs.sensitivity_status }}
          Auto-generated by blog-agent.
          "
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "committed=true" >> $GITHUB_OUTPUT

      - name: Check auto-merge eligibility
        if: steps.commit.outputs.committed == 'true'
        id: check_merge
        run: |
          HTML_FILE="blog/${{ steps.ceo.outputs.slug }}.html"
          COMPLIANCE_STATUS="${{ steps.ceo.outputs.compliance_status }}"
          SENSITIVITY_STATUS="${{ steps.ceo.outputs.sensitivity_status }}"
          
          if [ ! -f "$HTML_FILE" ]; then
            echo "auto_merge=false" >> $GITHUB_OUTPUT
            echo "reason=HTML file not found" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # HOLD on sensitivity always blocks auto-merge
          if [ "$SENSITIVITY_STATUS" = "HOLD" ]; then
            echo "auto_merge=false" >> $GITHUB_OUTPUT
            echo "reason=Sensitivity check returned HOLD - human review required" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Compliance REVIEW flags block auto-merge
          if grep -q "REVIEW:" "$HTML_FILE"; then
            echo "auto_merge=false" >> $GITHUB_OUTPUT
            echo "reason=Compliance flagged items for review" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Need compliance PASS AND sensitivity SAFE or CAUTION
          if [ "$COMPLIANCE_STATUS" = "PASS" ] && ([ "$SENSITIVITY_STATUS" = "SAFE" ] || [ "$SENSITIVITY_STATUS" = "CAUTION" ]); then
            echo "auto_merge=true" >> $GITHUB_OUTPUT
            echo "reason=Compliance PASS, Sensitivity $SENSITIVITY_STATUS" >> $GITHUB_OUTPUT
          else
            echo "auto_merge=false" >> $GITHUB_OUTPUT
            echo "reason=Compliance: $COMPLIANCE_STATUS, Sensitivity: $SENSITIVITY_STATUS" >> $GITHUB_OUTPUT
          fi

      - name: Open pull request
        if: steps.commit.outputs.committed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --title "Blog draft: ${{ steps.ceo.outputs.title }}" \
            --body "Auto-generated by the blog agent.

          **Topic:** ${{ steps.ceo.outputs.topic }}
          **Slug:** ${{ steps.ceo.outputs.slug }}
          **Compliance status:** ${{ steps.ceo.outputs.compliance_status }}
          **Sensitivity status:** ${{ steps.ceo.outputs.sensitivity_status }}
          **Auto-merge:** ${{ steps.check_merge.outputs.auto_merge }}
          **Reason:** ${{ steps.check_merge.outputs.reason }}

          ### Review checklist (if PR stays open)
          - [ ] Voice reads as human, not AI
          - [ ] No outcome guarantees or dollar promises
          - [ ] Statute citations accurate (see audit comment in HTML)
          - [ ] Houston/Texas references real
          - [ ] **Check sensitivity audit** if status is HOLD or CAUTION
          - [ ] Internal links point to real pages

          See HTML comments at top of file for full audit details (compliance + sensitivity)." \
            --head "${{ steps.commit.outputs.branch }}" \
            --base main)
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Auto-merge if eligible
        if: steps.commit.outputs.committed == 'true' && steps.check_merge.outputs.auto_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head "${{ steps.commit.outputs.branch }}" --json number --jq '.[0].number')
          gh pr merge "$PR_NUMBER" --squash --delete-branch
          echo "Auto-merged PR #$PR_NUMBER"

      - name: Summarize
        if: steps.commit.outputs.committed == 'true'
        run: |
          if [ "${{ steps.check_merge.outputs.auto_merge }}" = "true" ]; then
            echo "::notice::Post auto-merged. Sensitivity: ${{ steps.ceo.outputs.sensitivity_status }}, Compliance: ${{ steps.ceo.outputs.compliance_status }}"
          else
            echo "::notice::PR open for review. Reason: ${{ steps.check_merge.outputs.reason }}"
            echo "::notice::PR: ${{ steps.pr.outputs.pr_url }}"
          fi

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DATE_HUMAN=$(date +"%B %d, %Y at %H:%M UTC")
          
          gh issue create \
            --title "Blog agent failed on $(date +%Y-%m-%d)" \
            --body "The blog generation workflow failed on $DATE_HUMAN.

          Failed workflow run: $RUN_URL

          Click the link above to see which step failed and the error log."
