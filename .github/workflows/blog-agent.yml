name: Blog Agent

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch: {}

concurrency:
  group: blog-agent
  cancel-in-progress: false

jobs:
  generate-post:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/scripts/requirements.txt

      - name: Run CEO agent
        id: ceo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          BLOG_AGENT_SHEET_ID: ${{ secrets.BLOG_AGENT_SHEET_ID }}
        run: |
          python .github/scripts/ceo.py

      - name: Configure git
        if: steps.ceo.outputs.slug != ''
        run: |
          git config user.name "blog-agent[bot]"
          git config user.email "blog-agent@nalawtx.com"

      - name: Create branch and commit
        if: steps.ceo.outputs.slug != ''
        id: commit
        run: |
          BRANCH="blog-agent/${{ steps.ceo.outputs.slug }}"
          git checkout -b "$BRANCH"
          git add blog/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "committed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "blog: ${{ steps.ceo.outputs.title }}" \
            -m "Topic: ${{ steps.ceo.outputs.topic }}" \
            -m "Compliance: ${{ steps.ceo.outputs.compliance_status }}" \
            -m "Sensitivity: ${{ steps.ceo.outputs.sensitivity_status }}" \
            -m "Auto-generated by blog-agent."
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "committed=true" >> $GITHUB_OUTPUT

      - name: Check auto-merge eligibility
        if: steps.commit.outputs.committed == 'true'
        id: check_merge
        run: |
          HTML_FILE="blog/${{ steps.ceo.outputs.slug }}.html"
          COMPLIANCE_STATUS="${{ steps.ceo.outputs.compliance_status }}"
          SENSITIVITY_STATUS="${{ steps.ceo.outputs.sensitivity_status }}"
          WARNINGS=""

          # Hard stops: the only cases that block publishing.
          if [ ! -f "$HTML_FILE" ]; then
            echo "auto_merge=false" >> $GITHUB_OUTPUT
            echo "reason=HTML file not found" >> $GITHUB_OUTPUT
            echo "warnings=HTML file not found" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$COMPLIANCE_STATUS" = "UNKNOWN" ]; then
            echo "auto_merge=false" >> $GITHUB_OUTPUT
            echo "reason=Compliance audit did not run - post is unaudited" >> $GITHUB_OUTPUT
            echo "warnings=Compliance audit did not run" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Everything else publishes, but is reported.
          if [ "$SENSITIVITY_STATUS" = "HOLD" ] || [ "$SENSITIVITY_STATUS" = "CAUTION" ]; then
            WARNINGS="$WARNINGS Sensitivity $SENSITIVITY_STATUS (see audit comment at top of post)."
          fi
          if grep -q "REVIEW:" "$HTML_FILE"; then
            N=$(grep -c "REVIEW:" "$HTML_FILE")
            WARNINGS="$WARNINGS Compliance marked $N passage(s) with REVIEW."
          fi
          if [ "$COMPLIANCE_STATUS" = "FLAGGED" ] && ! grep -q "REVIEW:" "$HTML_FILE"; then
            WARNINGS="$WARNINGS Compliance summary FLAGGED (no inline markers)."
          fi

          # Save the flagged lines for the warning issue
          grep "REVIEW:" "$HTML_FILE" | sed 's/^[[:space:]]*//' | head -20 > /tmp/review_lines.txt || true

          echo "auto_merge=true" >> $GITHUB_OUTPUT
          echo "reason=Published (Compliance: $COMPLIANCE_STATUS, Sensitivity: $SENSITIVITY_STATUS)" >> $GITHUB_OUTPUT
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT

      - name: Open pull request
        if: steps.commit.outputs.committed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(cat <<'EOF'
          Auto-generated by the blog agent.

          **Topic:** ${{ steps.ceo.outputs.topic }}
          **Slug:** ${{ steps.ceo.outputs.slug }}
          **Compliance status:** ${{ steps.ceo.outputs.compliance_status }}
          **Sensitivity status:** ${{ steps.ceo.outputs.sensitivity_status }}
          **Auto-merge:** ${{ steps.check_merge.outputs.auto_merge }}
          **Reason:** ${{ steps.check_merge.outputs.reason }}

          ### Review checklist (if PR stays open)
          - [ ] Voice reads as human, not AI
          - [ ] No outcome guarantees or dollar promises
          - [ ] Statute citations accurate (see audit comment in HTML)
          - [ ] Houston/Texas references real
          - [ ] Check sensitivity audit if status is HOLD or CAUTION
          - [ ] Internal links point to real pages

          See HTML comments at top of file for full audit details.
          EOF
          )
          PR_URL=$(gh pr create \
            --title "Blog draft: ${{ steps.ceo.outputs.title }}" \
            --body "$BODY" \
            --head "${{ steps.commit.outputs.branch }}" \
            --base main)
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Auto-merge if eligible
        if: steps.commit.outputs.committed == 'true' && steps.check_merge.outputs.auto_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head "${{ steps.commit.outputs.branch }}" --json number --jq '.[0].number')
          gh pr merge "$PR_NUMBER" --squash --delete-branch
          echo "Auto-merged PR #$PR_NUMBER"

      - name: Warn about flagged or held post
        if: steps.commit.outputs.committed == 'true' && (steps.check_merge.outputs.warnings != '' || steps.check_merge.outputs.auto_merge != 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.check_merge.outputs.auto_merge }}" = "true" ]; then
            TITLE="Published with warnings: ${{ steps.ceo.outputs.title }}"
            HEAD="This post was PUBLISHED automatically, but the checks flagged it. Please review the live post."
            LINK="**Live post:** https://nalawtx.com/blog/${{ steps.ceo.outputs.slug }}"
          else
            TITLE="NOT published, needs review: ${{ steps.ceo.outputs.title }}"
            HEAD="This post was NOT published. Reason: ${{ steps.check_merge.outputs.reason }}"
            LINK="**Review and merge here:** ${{ steps.pr.outputs.pr_url }}"
          fi
          {
            echo "$HEAD"
            echo ""
            echo "$LINK"
            echo ""
            echo "**Warnings:** ${{ steps.check_merge.outputs.warnings }}"
            echo "**Compliance:** ${{ steps.ceo.outputs.compliance_status }} | **Sensitivity:** ${{ steps.ceo.outputs.sensitivity_status }}"
            if [ -s /tmp/review_lines.txt ]; then
              echo ""
              echo "### Flagged passages"
              echo '```'
              cat /tmp/review_lines.txt
              echo '```'
            fi
            echo ""
            echo "To fix a flagged passage: edit blog/${{ steps.ceo.outputs.slug }}.html on GitHub and commit. Close this issue when done."
          } > /tmp/issue_body.md
          gh issue create --title "$TITLE" --body-file /tmp/issue_body.md

      - name: Summarize
        if: steps.commit.outputs.committed == 'true'
        run: |
          if [ "${{ steps.check_merge.outputs.auto_merge }}" = "true" ]; then
            echo "::notice::Post auto-merged. ${{ steps.check_merge.outputs.reason }}"
          else
            echo "::notice::PR open for review. Reason: ${{ steps.check_merge.outputs.reason }}"
            echo "::notice::PR: ${{ steps.pr.outputs.pr_url }}"
          fi

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create \
            --title "Blog agent failed on $(date +%Y-%m-%d)" \
            --body "The blog generation workflow failed. See: $RUN_URL"
