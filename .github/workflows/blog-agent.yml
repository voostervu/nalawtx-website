      - name: Check auto-merge eligibility
        if: steps.commit.outputs.committed == 'true'
        id: check_merge
        run: |
          HTML_FILE="blog/${{ steps.ceo.outputs.slug }}.html"
          COMPLIANCE_STATUS="${{ steps.ceo.outputs.compliance_status }}"
          SENSITIVITY_STATUS="${{ steps.ceo.outputs.sensitivity_status }}"

          if [ ! -f "$HTML_FILE" ]; then
            echo "auto_merge=false" >> $GITHUB_OUTPUT
            echo "reason=HTML file not found" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Sensitivity HOLD always blocks.
          if [ "$SENSITIVITY_STATUS" = "HOLD" ]; then
            echo "auto_merge=false" >> $GITHUB_OUTPUT
            echo "reason=Sensitivity HOLD - human review required" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Specific inline compliance concerns always block.
          # This is the real signal: the Compliance agent marks individual
          # passages it wants a human to look at. A FLAGGED summary with no
          # inline markers means statutory complexity, not an actual problem.
          if grep -q "REVIEW:" "$HTML_FILE"; then
            REVIEW_COUNT=$(grep -c "REVIEW:" "$HTML_FILE")
            echo "auto_merge=false" >> $GITHUB_OUTPUT
            echo "reason=Compliance marked $REVIEW_COUNT item(s) for inline review" >> $GITHUB_OUTPUT
            exit 0
          fi

          # If the Compliance agent never ran, we have no audit at all.
          # Do not publish unaudited content.
          if [ "$COMPLIANCE_STATUS" = "UNKNOWN" ]; then
            echo "auto_merge=false" >> $GITHUB_OUTPUT
            echo "reason=Compliance audit did not complete - no audit on file" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Audited, no inline concerns, sensitivity not HOLD. Ship it.
          echo "auto_merge=true" >> $GITHUB_OUTPUT
          echo "reason=Audited clean (Compliance: $COMPLIANCE_STATUS, Sensitivity: $SENSITIVITY_STATUS, 0 inline flags)" >> $GITHUB_OUTPUT
