name: Fix Blog SEO Tags and Sitemap

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fix canonical tags and sitemap
        run: |
          python .github/scripts/fix_seo.py
          python .github/scripts/add_internal_links.py
          python .github/scripts/site_schema.py

      - name: Commit
        run: |
          git config user.name "blog-agent[bot]"
          git config user.email "blog-agent@nalawtx.com"
          git add -A -- '*.html' sitemap.xml llms.txt
          [ -d .github/audits ] && git add .github/audits
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Site upkeep: tags, sitemap, llms.txt, audit notes, internal links, schema"
          git push
