name: Fix Blog SEO Tags and Sitemap

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fix canonical tags and sitemap
        run: python .github/scripts/fix_seo.py

      - name: Commit
        run: |
          git config user.name "blog-agent[bot]"
          git config user.email "blog-agent@nalawtx.com"
          git add blog/ sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix blog canonical tags and add posts to sitemap"
          git push
