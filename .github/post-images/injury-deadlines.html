<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Google Business Profile post image. Rendered to assets/posts/ by the "Render Post Image" workflow. -->
<style>
@font-face{font-family:Fraunces;font-weight:400;src:url(../../node_modules/@fontsource/fraunces/files/fraunces-latin-400-normal.woff2)}
@font-face{font-family:Fraunces;font-weight:400;font-style:italic;src:url(../../node_modules/@fontsource/fraunces/files/fraunces-latin-400-italic.woff2)}
@font-face{font-family:Fraunces;font-weight:500;src:url(../../node_modules/@fontsource/fraunces/files/fraunces-latin-500-normal.woff2)}
@font-face{font-family:Manrope;font-weight:500;src:url(../../node_modules/@fontsource/manrope/files/manrope-latin-500-normal.woff2)}
@font-face{font-family:Manrope;font-weight:700;src:url(../../node_modules/@fontsource/manrope/files/manrope-latin-700-normal.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:900px;background:#00092A;color:#FAF6F0;font-family:Manrope,sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;right:-260px;top:-260px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,#1B2851 0%,rgba(27,40,81,0) 70%)}
.mark{position:absolute;right:-70px;bottom:-90px;width:560px;height:560px;opacity:.07;background:url(../../assets/mark-gold.png) no-repeat;background-size:1258.4px 1154.6px;background-position:-349.2px -534.8px}
.wrap{position:absolute;inset:0;padding:84px 92px 76px;display:flex;flex-direction:column}
.eyebrow{font-weight:700;font-size:23px;letter-spacing:.24em;text-transform:uppercase;color:#EFD372}
h1{font-family:Fraunces,serif;font-weight:400;font-size:96px;line-height:1.04;letter-spacing:-.02em;margin-top:30px;max-width:900px}
h1 em{font-style:italic;color:#EFD372}
ul{list-style:none;margin-top:52px;display:flex;flex-direction:column;gap:20px}
li{display:flex;align-items:center;gap:22px;font-size:34px;font-weight:500;color:#F1EBDF}
li b{flex:none;width:46px;height:46px;border:2px solid #C9A545;border-radius:50%;display:grid;place-items:center;font-family:Fraunces,serif;font-weight:500;font-size:24px;color:#EFD372}
.foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;border-top:1px solid rgba(239,211,114,.28);padding-top:30px}
.logo{width:205px;height:118px;background:url(../../assets/logo-gold.png) no-repeat;background-size:456.8px 304.5px;background-position:-126.2px -93.6px}
.cta{text-align:right}
.cta span{display:block;font-size:21px;letter-spacing:.14em;text-transform:uppercase;color:#C9A545;font-weight:700}
.cta strong{display:block;font-family:Fraunces,serif;font-weight:500;font-size:52px;margin-top:6px;color:#FAF6F0}
</style>
</head>
<body>
<div class="glow"></div>
<div class="mark"></div>
<div class="wrap">
  <div class="eyebrow">Texas injury deadlines</div>
  <h1>The clock is <em>already running.</em></h1>
  <ul>
    <li><b>1</b>Most injury claims: two years to file suit</li>
    <li><b>2</b>Claims against a city can need notice in months</li>
    <li><b>3</b>Evidence fades long before either deadline</li>
  </ul>
  <div class="foot">
    <div class="logo"></div>
    <div class="cta"><span>Free consultation · 24/7</span><strong>(713) 842-9442</strong></div>
  </div>
</div>
</body>
</html>
